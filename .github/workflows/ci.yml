name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # dist はコミットしている（git 依存で入れる側にビルドを要求しないため）。ビルド結果が変わっていたら commit し忘れ
      - run: git diff --exit-code -- dist
